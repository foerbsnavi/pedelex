- system: bosch
  code: "530"
  category: battery
  title:
    en: Battery fault
    de: Akkufehler
  description:
    en: The drive cannot communicate correctly with the eBike battery. Frequent causes are dirty or
      corroded battery contacts, a battery not seated properly, or a non-original battery; an
      internal battery electronics fault is also possible. Bosch's official procedure is to switch
      off, remove and reinsert the battery and restart.
    de: "Der Antrieb kann nicht korrekt mit dem E-Bike-Akku kommunizieren. Häufige Ursachen sind
      verschmutzte oder korrodierte Akkukontakte, ein nicht richtig eingerasteter Akku oder ein
      nicht originaler Akku; auch ein Fehler der Akkuelektronik ist möglich. Das offizielle
      Bosch-Vorgehen: ausschalten, Akku entnehmen und wieder einsetzen, neu starten."
  applies_to:
    - Gen2-Gen4 (BES2/BES3)
    - "Displays: Intuvia/Purion/Kiox/Nyon"
