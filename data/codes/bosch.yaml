- system: bosch
  code: "550"
  category: system
  title:
    en: Impermissible load detected
    de: Unzulässiger Verbraucher erkannt
  description:
    en: The system has detected an electrical consumer on the drive system that draws more power than
      allowed — typically a third-party accessory such as a non-approved light or a USB device.
      After removing the consumer and restarting, the error usually disappears. If it stays, the
      wiring should be checked by a dealer.
    de: Das System hat einen elektrischen Verbraucher am Antriebssystem erkannt, der mehr Strom zieht
      als erlaubt — typischerweise ein Fremdzubehör wie eine nicht freigegebene Lampe oder ein
      USB-Gerät. Nach dem Entfernen des Verbrauchers und einem Neustart verschwindet der Fehler in
      der Regel. Bleibt er bestehen, sollte die Verkabelung vom Händler geprüft werden.
  applies_to:
