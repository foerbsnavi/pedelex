      einen Fehler der Akkuelektronik. Die offizielle Bosch-Abhilfe ist ein Neustart; ein
      wiederkehrender 610 bedeutet, dass der Akku vom Händler untersucht werden muss. Tiefentladene
      Akkus lassen sich manchmal durch vorsichtiges Laden mit dem Original-Ladegerät wiederbeleben.
  applies_to:
