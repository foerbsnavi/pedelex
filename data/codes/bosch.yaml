- system: bosch
  code: "640"
  category: battery
  title:
    en: Internal battery fault (cells)
    de: Interner Akkufehler (Zellen)
  description:
    en: A further internal fault of the eBike battery, often observed in connection with deeply
      discharged or damaged cells; the battery frequently refuses to charge. Bosch's official
      measure is only a restart — beyond that the dealer must diagnose the battery. If cells are
      damaged, replacing the battery is usually the only option.
