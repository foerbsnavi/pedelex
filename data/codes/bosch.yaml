- system: bosch
  code: "605"
  category: battery
  title:
    en: Battery temperature error
    de: Temperaturfehler des Akkus
  description:
    en: The eBike battery is outside its permissible temperature range — too hot after charging or
      riding in strong heat, or too cold in winter. The system blocks operation to protect the
      cells. Once the battery has returned to normal temperature and the system is restarted,
      everything usually works again.
    de: Der E-Bike-Akku liegt außerhalb des zulässigen Temperaturbereichs — zu heiß nach dem Laden oder
      Fahren bei starker Hitze, oder zu kalt im Winter. Das System blockiert den Betrieb zum Schutz
      der Zellen. Sobald der Akku wieder normale Temperatur hat und das System neu gestartet wird,
      funktioniert in der Regel alles wieder.
  applies_to:
    - Gen2-Gen4 (BES2/BES3)
    - "Displays: Intuvia/Purion/Kiox/Nyon"
  affected_components:
    - battery
  common_causes:
    - id: battery_overheated
      likelihood: high
      label:
        en: Battery too hot (heat, sun, charging)
        de: Akku zu heiß (Hitze, Sonne, Ladevorgang)
    - id: battery_too_cold
      likelihood: medium
      label:
        en: Battery too cold (winter operation)
        de: Akku zu kalt (Winterbetrieb)
  symptoms:
    - en: Error 605 on the display
      de: Fehler 605 im Display
    - en: No assistance in extreme heat or cold
      de: Keine Unterstützung bei extremer Hitze oder Kälte
