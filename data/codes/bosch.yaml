  category: charger
  title:
    en: Charger fault
    de: Fehler des Ladegeräts
  description:
    en: "The system has detected a fault in the charger. Bosch's official instruction is unusually clear
      here: replace the charger and contact the dealer. Riding is not affected — the bike simply
      cannot be charged with the defective unit. Before buying a replacement it is worth trying a
      different mains socket and checking all plug connections."
    de: "Das System hat einen Fehler des Ladegeräts erkannt. Die offizielle Bosch-Anweisung ist hier
      ungewöhnlich eindeutig: Ladegerät ersetzen und Händler kontaktieren. Das Fahren ist nicht
      beeinträchtigt — das Rad kann mit dem defekten Gerät nur nicht geladen werden. Vor dem Neukauf
      lohnt es sich, eine andere Steckdose zu testen und alle Steckverbindungen zu prüfen."
