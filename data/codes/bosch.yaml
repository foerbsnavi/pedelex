- system: bosch
  code: "540"
  category: motor
  title:
    en: Drive unit temperature error
    de: Temperaturfehler der Antriebseinheit
  description:
    en: The drive unit is outside its permissible temperature range — usually too hot after long, steep
      climbs in high ambient temperatures, more rarely too cold in winter. The system shuts
      assistance down to protect itself. After cooling down (or warming up) and a restart, the drive
      normally works again without repair.
    de: Die Antriebseinheit befindet sich außerhalb des zulässigen Temperaturbereichs — meist zu heiß
      nach langen, steilen Anstiegen bei hohen Außentemperaturen, seltener zu kalt im Winter. Das
      System schaltet die Unterstützung zum Eigenschutz ab. Nach dem Abkühlen (bzw. Aufwärmen) und
      einem Neustart funktioniert der Antrieb normalerweise ohne Reparatur wieder.
  applies_to:
    - Gen2-Gen4 (BES2/BES3)
    - "Displays: Intuvia/Purion/Kiox/Nyon"
  affected_components:
    - drive_unit
  common_causes:
    - id: overheating_sustained_load
      likelihood: high
      label:
        en: Overheating from sustained high load (long climbs)
        de: Überhitzung durch anhaltend hohe Last (lange Anstiege)
    - id: high_ambient_temperature
      likelihood: medium
      label:
        en: High ambient temperature / direct sun
        de: Hohe Außentemperatur / direkte Sonne
    - id: extreme_cold
      likelihood: low
      label:
        en: Extreme cold
        de: Extreme Kälte
  symptoms:
    - en: Error 540 on the display, typically during or after a hard climb
      de: Fehler 540 im Display, typischerweise während oder nach einem harten Anstieg
    - en: Assistance switches off
      de: Unterstützung schaltet ab
  self_help:
    - en: Stop and switch the system off
      de: Anhalten und System ausschalten
    - en: Let the drive unit cool down (or warm up) for 10-15 minutes, ideally in the shade
      de: Antriebseinheit 10-15 Minuten abkühlen (bzw. aufwärmen) lassen, am besten im Schatten
    - en: Restart the system
      de: System neu starten
