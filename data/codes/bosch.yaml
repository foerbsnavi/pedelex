      beschädigten Zellen; oft lässt sich der Akku nicht mehr laden. Die offizielle Bosch-Maßnahme
      ist nur ein Neustart — darüber hinaus muss der Händler den Akku diagnostizieren. Sind Zellen
      beschädigt, bleibt in der Regel nur der Akkutausch.
