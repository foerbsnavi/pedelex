      label:
        en: Damaged battery cells
        de: Beschädigte Akkuzellen
    - id: bms_defect
      likelihood: medium
      label:
        en: Defective battery electronics
        de: Defekte Akkuelektronik
  symptoms:
    - en: Error 640 on the display
      de: Fehler 640 im Display
    - en: Battery does not charge
      de: Akku lädt nicht
