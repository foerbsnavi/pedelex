- system: bosch
  code: "610"
  category: battery
  title:
    en: Battery voltage error
    de: Spannungsfehler des Akkus
  description:
    en: The battery reports an implausible voltage, for example after deep discharge, due to ageing
      cells or a fault in the battery electronics. Bosch's official remedy is a restart; a recurring
      610 means the battery must be examined by a dealer. Deeply discharged batteries can sometimes
      be revived by careful charging with the original charger.
