    - id: cell_ageing
      likelihood: medium
      label:
        en: Aged or weak battery cells
        de: Gealterte oder schwache Akkuzellen
    - id: bms_defect
      likelihood: medium
      label:
        en: Defective battery electronics
        de: Defekte Akkuelektronik
  symptoms:
    - en: Error 610 on the display
